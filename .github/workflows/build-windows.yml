name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build EXE
        run: dotnet publish MathOCRTeacherPro.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MathOCRTeacherPro-Windows-x64
          path: bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/MathOCRTeacherPro.exe
